services:
  web:
    build: .
    container_name: webtoonsz_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: webtoonsz
      DB_USER: webtoonsz
      DB_PASS: webtoonsz123
    volumes:
      - ./webtoon:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /var/www/html/uploads/perfis /var/www/html/uploads/obras /var/www/html/uploads/capitulos &&
             chown -R www-data:www-data /var/www/html/uploads &&
             apache2-foreground"

  db:
    image: mysql:8.0
    container_name: webtoonsz_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: webtoonsz
      MYSQL_USER: webtoonsz
      MYSQL_PASSWORD: webtoonsz123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webtoonsz_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
