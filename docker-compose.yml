services:
  web:
    build: .
    container_name: webtoonsz_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-webtoonsz}
      DB_USER: ${DB_USER:-webtoonsz}
      DB_PASS: ${DB_PASS:-webtoonsz123}
    volumes:
      - ./src:/var/www/html
    # garante que o Apache consiga gravar as fotos de perfil
    command: >
      sh -c "mkdir -p /var/www/html/uploads/perfis &&
             chown -R www-data:www-data /var/www/html/uploads &&
             apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: webtoonsz_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root123}
      MYSQL_DATABASE: ${DB_NAME:-webtoonsz}
      MYSQL_USER: ${DB_USER:-webtoonsz}
      MYSQL_PASSWORD: ${DB_PASS:-webtoonsz123}
    volumes:
      - dbdata:/var/lib/mysql
      # roda só na primeira criação do volume
      - ./banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASS:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webtoonsz_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 20M
    depends_on:
      - db

volumes:
  dbdata:
