services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webtoonsz_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-webtoonsz}
      DB_USER: ${DB_USER:-webtoonsz}
      DB_PASS: ${DB_PASS:-webtoonsz123}
    volumes:
      - ./webtoon:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: webtoonsz_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-webtoonsz}
      MYSQL_USER: ${DB_USER:-webtoonsz}
      MYSQL_PASSWORD: ${DB_PASS:-webtoonsz123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    volumes:
      - dbdata:/var/lib/mysql
      - ./bc/banco.sql:/docker-entrypoint-initdb.d/01-banco.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webtoonsz_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
